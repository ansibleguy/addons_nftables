---

- name: "NFTables-Addons | Timer | Systemd | {{ addon_key }} | Adding timer"
  ansible.builtin.template:
    src: "templates/etc/systemd/system/addon.{{ item }}.j2"
    dest: "/etc/systemd/system/{{ systemd_name }}.{{ item }}"
    mode: 0644
    owner: 'root'
    group: 'root'
  loop:
    - 'service'
    - 'timer'

- name: "NFTables-Addons | Timer | Systemd | {{ addon_key }} | Starting/Enabling timer"
  ansible.builtin.systemd:
    name: "{{ systemd_name }}.timer"
    state: started
    enabled: true
    daemon_reload: yes

- name: "NFTables-Addons | Timer | Systemd | {{ addon_key }} | Remove legacy (1/2)"
  ansible.builtin.systemd:
    name: "{{ systemd_name_legacy }}.timer"
    state: stopped
    enabled: false
  register: legacy_svc_removal
  failed_when:
    - legacy_svc_removal.failed
    - "'does not exist' not in legacy_svc_removal.msg"
    - "'Could not find' not in legacy_svc_removal.msg"

- name: "NFTables-Addons | Timer | Systemd | {{ addon_key }} | Remove legacy (2/2)"
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ systemd_name_legacy }}.{{ item }}"
    state: absent
  loop:
    - 'service'
    - 'timer'
